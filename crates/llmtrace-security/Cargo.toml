[package]
name = "llmtrace-security"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Security analysis engines for prompt injection detection"

[features]
default = []
ml = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:tracing",
    "dep:tokio",
]
# LLM-as-a-Judge analysis tier (issue #43). Pulls in the reqwest HTTP
# client and async-runtime dependencies required by the judge backends.
judge = [
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:thiserror",
]
cuda = ["candle-core?/cuda", "candle-nn?/cuda", "candle-transformers?/cuda"]
metal = ["candle-core?/metal", "candle-nn?/metal", "candle-transformers?/metal"]

[dependencies]
llmtrace-core.workspace = true
serde.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
rand = "0.8"
regex = "1.10"
base64 = "0.22"
unicode-normalization = "0.1"
serde_json = "1.0"
arc-swap = "1.9"

# ML dependencies (opt-in via `ml` feature)
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.22", optional = true }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["tokio", "rustls-tls"] }
tracing = { version = "0.1", optional = true }
# serde_json is a required dependency (used by tool_firewall FormatConstraint)
tokio = { version = "1", optional = true, features = ["rt"] }

# Judge dependencies (opt-in via `judge` feature)
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
thiserror = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[example]]
name = "judge_smoke"
required-features = ["judge"]
