# ============================================================================
# LLMTrace — Self-host Quickstart
# ============================================================================
#
# Runs the published proxy + dashboard images with embedded SQLite storage —
# no external services required.
#
#   1. cp config.example.yaml config.yaml   # set upstream_url + your keys
#   2. docker compose up -d
#   3. Point your OpenAI-compatible client at http://localhost:8080/v1
#   4. Dashboard at http://localhost:3000
#
# For the full production stack (ClickHouse, Postgres, Redis, monitoring),
# see deployments/docker-compose/ and docs/deployment/docker-compose.md.
# ============================================================================

services:
  proxy:
    image: ghcr.io/techlab-innov/llmtrace-proxy:${LLMTRACE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${LLMTRACE_PROXY_PORT:-8080}:8080"
    environment:
      LLMTRACE_STORAGE_PROFILE: sqlite
      LLMTRACE_LOG_LEVEL: ${LLMTRACE_LOG_LEVEL:-info}
    volumes:
      - ./config.yaml:/etc/llmtrace/config.yaml:ro
      - model-cache:/home/llmtrace/.cache/llmtrace/models
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 300s

  dashboard:
    image: ghcr.io/techlab-innov/llmtrace-dashboard:${LLMTRACE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${LLMTRACE_DASHBOARD_PORT:-3000}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      LLMTRACE_API_URL: http://proxy:8080
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  model-cache:
