{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "llmtrace.fullname" . }}
  namespace: {{ .Values.monitoring.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "llmtrace.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "llmtrace.fullname" . }}.rules
      rules:
        - alert: LLMTraceProxyDown
          expr: up{job="{{ include "llmtrace.fullname" . }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LLMTrace proxy is down"
            description: "Prometheus has not been able to scrape the LLMTrace proxy for 5 minutes."
        - alert: LLMTraceHighErrorRate
          expr: |
            sum(rate(llmtrace_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(llmtrace_requests_total[5m])), 1)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "LLMTrace proxy error rate is above 5%"
            description: "The proxy has been returning 5xx responses above the 5% threshold for 5 minutes."
        - alert: LLMTraceCircuitBreakerOpen
          expr: llmtrace_circuit_breaker_state{state="open"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "LLMTrace circuit breaker is open"
            description: "One or more LLMTrace subsystems have been in circuit-breaker open state for over 1 minute."
        - alert: LLMTraceHighCriticalSecurityFindingRate
          expr: sum(rate(llmtrace_security_findings_total{severity="Critical"}[1m])) > 10
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "LLMTrace critical finding rate is high"
            description: "Critical security findings exceeded 10 per minute."
        # ---- Judge golden-set drift (#66 T4) -----------------------------
        # Updated by GET /debug/judge/golden_set/replay; the nightly
        # cron in CronJob `llmtrace-judge-golden-set-replay` calls it.
        # Floors mirror crates/llmtrace-security/tests/judge_golden_set.rs::alignment_floor.
        - alert: LLMTraceJudgeGoldenSetAlignmentDrift
          expr: |
            llmtrace_judge_golden_set_alignment{category="prompt_injection"} < 0.85
            or
            llmtrace_judge_golden_set_alignment{category="jailbreak"}        < 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LLMTrace judge golden-set alignment dropped below floor"
            description: |
              Per-category alignment between the security analyzer and
              the curated golden set has been below the 0.85 floor for
              15 minutes. The fast detection tier is drifting; new
              regex / ML weights or a corpus drift may be the cause.
            runbook_url: https://docs.llmtrace.setloop.io/runbooks/judge-golden-set-drift/
        - alert: LLMTraceJudgeGoldenSetFprDrift
          expr: llmtrace_judge_golden_set_false_positive_rate > 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LLMTrace judge golden-set false-positive rate exceeded ceiling"
            description: |
              The benign-fixture false-positive rate has been above the
              0.25 ceiling for 15 minutes. The detector is over-flagging;
              recent regex tightening or a new ML model is the likely
              culprit.
            runbook_url: https://docs.llmtrace.setloop.io/runbooks/judge-golden-set-drift/
        - alert: LLMTraceJudgeGoldenSetReplayStale
          expr: |
            time()
              - max by (category) (
                  timestamp(llmtrace_judge_golden_set_alignment)
                )
              > 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "LLMTrace judge golden-set replay has not run in 24h"
            description: |
              The /debug/judge/golden_set/replay endpoint has not
              updated the alignment gauges in over 24 hours. Either
              the nightly CronJob is failing, the LLMTRACE_GOLDEN_SET_PATH
              env var is unset on the running proxy, or
              server.debug_endpoints is OFF in production.
            runbook_url: https://docs.llmtrace.setloop.io/runbooks/judge-golden-set-drift/
{{- end }}
