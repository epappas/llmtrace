# ============================================================================
# LLMTrace Helm Chart — Default Values
# ============================================================================
# Override per-environment with: helm install -f values-production.yaml ...
# ============================================================================

# -- Global settings shared across all sub-charts
global:
  imageRegistry: ""
  imagePullSecrets: []

# ============================================================================
# Proxy
# ============================================================================
proxy:
  # -- Number of proxy replicas (overridden by HPA when enabled)
  replicaCount: 1

  image:
    repository: ghcr.io/epappas/llmtrace-proxy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag; defaults to Chart.appVersion
    tag: ""

  # -- Upstream LLM provider URL
  upstreamUrl: "https://api.openai.com"

  # -- Listen address inside the container
  listenAddr: "0.0.0.0:8080"

  # -- Storage profile: "lite", "memory", or "production"
  storageProfile: "production"

  # -- Enable security analysis
  enableSecurityAnalysis: true

  # -- Enable trace storage
  enableTraceStorage: true

  # -- Enable streaming SSE passthrough
  enableStreaming: true

  # -- Request timeout (ms)
  timeoutMs: 30000

  # -- Connection timeout (ms)
  connectionTimeoutMs: 5000

  # -- Max concurrent connections
  maxConnections: 1000

  # -- Max request body size (bytes, default 50 MB)
  maxRequestSizeBytes: 52428800

  # -- Max response body size retained in traces (bytes)
  maxResponseSizeBytes: 10485760

  # -- Security analysis timeout (ms)
  securityAnalysisTimeoutMs: 5000

  # -- Trace storage timeout (ms)
  traceStorageTimeoutMs: 10000

  tls:
    enabled: false
    certFile: ""
    keyFile: ""

  # -- gRPC ingestion gateway
  grpc:
    enabled: false
    listenAddr: "0.0.0.0:50051"

  # -- Rate limiting
  rateLimiting:
    enabled: true
    requestsPerSecond: 100
    burstSize: 200
    windowSeconds: 60

  # -- Circuit breaker
  circuitBreaker:
    enabled: true
    failureThreshold: 10
    recoveryTimeoutMs: 30000
    halfOpenMaxCalls: 3

  # -- Logging
  logging:
    level: "info"
    format: "json"

  # -- Alert engine
  alerts:
    enabled: false
    webhookUrl: ""
    minSeverity: "High"
    minSecurityScore: 70
    cooldownSeconds: 300

  # -- Graceful shutdown timeout (should be < terminationGracePeriodSeconds)
  shutdownTimeoutSeconds: 30

  # -- Kubernetes terminationGracePeriodSeconds (should be > shutdownTimeoutSeconds)
  terminationGracePeriodSeconds: 60

  # -- Cost caps
  costCaps:
    enabled: false

  # -- Cost estimation configuration
  costEstimation:
    enabled: true
    pricingFile: ""
    customModels: {}

  # -- Security analysis configuration
  securityAnalysis:
    mlEnabled: true
    mlModel: "protectai/deberta-v3-base-prompt-injection-v2"
    mlThreshold: 0.8
    mlCacheDir: "/home/llmtrace/.cache/llmtrace/models"
    mlPreload: true
    mlDownloadTimeoutSeconds: 300
    nerEnabled: false
    nerModel: "dslim/bert-base-NER"
    fusionEnabled: false
    fusionModelPath: ""
    jailbreakEnabled: true
    jailbreakThreshold: 0.7
    injecguardEnabled: false
    injecguardModel: "leolee99/InjecGuard"
    injecguardThreshold: 0.85
    piguardEnabled: false
    piguardModel: "leolee99/PIGuard"
    piguardThreshold: 0.85
    operatingPoint: "balanced"
    overDefence: false
    maxAnalysisTextBytes: 1048576

  # -- Enforcement configuration
  enforcement:
    mode: "log"
    analysisDepth: "fast"
    minSeverity: "High"
    minConfidence: 0.8
    timeoutMs: 2000
    categories: []

  # -- Streaming analysis configuration
  streamingAnalysis:
    enabled: false
    tokenInterval: 50
    outputEnabled: false
    earlyStopOnCritical: false

  # -- Output safety configuration
  outputSafety:
    enabled: false
    toxicityEnabled: false
    toxicityThreshold: 0.7
    blockOnCritical: false
    hallucinationEnabled: false
    hallucinationModel: "vectara/hallucination_evaluation_model"
    hallucinationThreshold: 0.5
    hallucinationMinResponseLength: 50

  # -- Boundary token defense configuration
  boundaryDefense:
    enabled: false
    shadowMode: false
    wrapRoles:
      - tool
    delimiter: "llmtrace-boundary"
    randomizeNonce: false
    injectSystemReminder: true
    systemReminderText: ""

  # -- Graceful shutdown configuration
  shutdown:
    timeoutSeconds: 30

  # -- Optional model cache PVC mounted into the proxy container
  modelCache:
    enabled: false
    existingClaim: ""
    mountPath: "/home/llmtrace/.cache/llmtrace/models"
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    initContainer:
      enabled: false
      image: ""
      command: []
      args: []
      env: []

  # -- Extra raw YAML appended to config.yaml for forward-compatible config injection
  extraConfig: ""

  # -- Additional environment variables for the proxy container
  extraEnv: []
  #   - name: RUST_LOG
  #     value: "llmtrace_proxy=debug,info"

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Startup probe — allows slow cold starts (e.g. ML model download,
  # storage initialisation) without triggering liveness kills.
  # failureThreshold × periodSeconds = 300s total startup budget.
  startupProbe:
    httpGet:
      path: /health
      port: http
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5

  # -- Liveness probe (only active after startupProbe succeeds)
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Readiness probe
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

  # -- Pod annotations
  podAnnotations: {}

  # -- Pod labels
  podLabels: {}

# ============================================================================
# Service
# ============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # -- gRPC port (enabled only when proxy.grpc.enabled)
  grpcPort: 50051
  annotations: {}

# ============================================================================
# Monitoring
# ============================================================================
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}

# ============================================================================
# Ingress
# ============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: llmtrace.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #   - secretName: llmtrace-tls
  #     hosts:
  #       - llmtrace.local

# ============================================================================
# Horizontal Pod Autoscaler
# ============================================================================
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # -- Custom metrics (optional)
  # metrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: http_requests_per_second
  #       target:
  #         type: AverageValue
  #         averageValue: "500"

# ============================================================================
# ServiceAccount
# ============================================================================
serviceAccount:
  create: true
  annotations: {}
  # -- Name override; defaults to release fullname
  name: ""

# ============================================================================
# Pod Disruption Budget
# ============================================================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ============================================================================
# Secrets — credentials for backing services
# ============================================================================
secrets:
  # -- If true, the chart creates a Secret from the values below.
  # Set to false and provide existingSecret to use a pre-existing Secret.
  create: true
  # -- Name of an existing Secret to use instead
  existingSecret: ""

  # -- ClickHouse credentials
  clickhouseUrl: "http://llmtrace-clickhouse:8123"
  clickhouseDatabase: "llmtrace"

  # -- PostgreSQL credentials
  postgresUrl: "postgres://llmtrace:llmtrace@llmtrace-postgresql:5432/llmtrace"

  # -- Redis credentials
  redisUrl: "redis://llmtrace-redis-master:6379"

# ============================================================================
# NetworkPolicy
# ============================================================================
networkPolicy:
  enabled: false

# ============================================================================
# ClickHouse sub-chart
# ============================================================================
clickhouse:
  enabled: true
  shards: 1
  replicaCount: 1
  auth:
    username: default
    password: ""
  persistence:
    enabled: true
    size: 10Gi

# ============================================================================
# PostgreSQL sub-chart
# ============================================================================
postgresql:
  enabled: true
  auth:
    username: llmtrace
    password: llmtrace
    database: llmtrace
  primary:
    persistence:
      enabled: true
      size: 5Gi

# ============================================================================
# Redis sub-chart
# ============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi
