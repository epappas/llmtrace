# LLMTrace tenant config — pro tier example.
# Multi-replica proxy, persistent dashboard, debug logging, datamarking on.
#
# Auth: two-tier key model. The lifecycle library bootstraps a tenant on
# the live proxy after readiness, then mints a scoped Operator-role key
# via POST /api/v1/auth/keys. That operator key is what the tenant uses
# for runtime traffic. The bootstrap admin key (auto-generated or pinned
# via `api_key:` below) is retained by the caller for self-service /
# admin pages and NEVER handed to the tenant. See starter.yaml + the
# README "Per-tenant API key auth" section for the full contract.
#
# DURABILITY across `update --strategy recreate` (traces + tenant id):
# By default the proxy stores traces + tenant rows in a SQLite file on the
# pod's container-local disk, which Basilica DESTROYS on recreate (the pod
# is deleted and re-created). To make state survive recreate, pick ONE:
#
#   A) External production backend (fully durable, recommended for prod):
#      set LLMTRACE_STORAGE_PROFILE=production and provide reachable
#      Postgres + ClickHouse + Redis URLs via env (see the `env:` notes
#      below). Traces + tenants live outside the pod, so recreate is safe.
#
#   B) Object-store persistent mount (durable, SQLite synced to a bucket):
#      uncomment `proxy.persistent_volume` below. Requires a pre-provisioned
#      Basilica `credentials_secret` and a bucket. The lifecycle library
#      attaches a Basilica StorageSpec and repoints
#      LLMTRACE_STORAGE_DATABASE_PATH onto the mount automatically.
#
#   C) restart-only updates (PARTIAL — in-place pod roll only): keep SQLite
#      but always use `update --strategy restart` for upgrades, never
#      `recreate`. A rolling restart keeps the pod's disk, so rows survive.
#      CAVEAT: this is NOT durable across a node reschedule / eviction, and
#      restart 404s on a freshly-provisioned deployment until its k8s CR
#      materialises. Treat as a stopgap, not a guarantee.
#
# tenant_uuid: the STABLE internal operator tenant id, CALLER-PROVIDED for a
# stable identity across redeploys. The lifecycle library sends it as the `id`
# on POST /api/v1/tenants so the proxy keeps the SAME tenant id every recreate
# (the proxy honours an explicit id on create — idempotent create). Supply it
# via the LLMTRACE_TENANT_UUID env var (a valid UUID). There is NO hardcoded
# default: when empty, the lifecycle generates a fresh uuid4 at provision,
# uses it, and RETURNS it as `operator_tenant_id` — but that id is EPHEMERAL
# (identity will NOT survive recreate) unless you persist it and re-pass it
# here on the next provision/update.
tenant_uuid: "${LLMTRACE_TENANT_UUID:-}"

proxy:
  image: "ghcr.io/techlab-innov/llmtrace-proxy:${LLMTRACE_VERSION:-latest}"
  port: 8080
  cpu: "4"
  memory: 8Gi
  # sqlite metadata is per-pod on Basilica — replicas DO NOT share state.
  # To run replicas > 1, switch LLMTRACE_STORAGE_PROFILE to postgres and
  # set LLMTRACE_POSTGRES_URL via tenant_secrets_json. Until then,
  # replicas: 1 is the only correct setting; replicas > 1 will round-robin
  # to different sqlite files and produce intermittent stale reads.
  replicas: 1
  health_check_path: /health
  # ML preload (LLMTRACE_ML_ENABLED=1 + LLMTRACE_ML_PRELOAD=1) loads the
  # prompt_injection / ner / injecguard / piguard weights before /health flips
  # to ready. On a cpu=2 shape this regularly exceeds 600s; cpu=4 is faster
  # but still well over the library's old 600s default. The lifecycle library
  # auto-bumps to 1500s when both flags are on and this value is lower; we set
  # 1500 explicitly to silence the WARN and document the cost.
  startup_timeout_seconds: 1500
  # Option B — object-store persistent mount. Uncomment to make the SQLite
  # profile durable across recreate. Requires a Basilica-side secret named by
  # `credentials_secret` (holds the bucket creds) and an existing bucket.
  # The lifecycle library sets LLMTRACE_STORAGE_DATABASE_PATH to
  # <mount_path>/<db_filename> automatically, so leave the env var below unset
  # when this is on. `backend` is r2 | s3 | gcs.
  # persistent_volume:
  #   bucket: "${LLMTRACE_STORAGE_BUCKET}"
  #   credentials_secret: "${LLMTRACE_STORAGE_CREDENTIALS_SECRET}"
  #   backend: r2
  #   mount_path: /data
  #   db_filename: llmtrace.db
  #   sync_interval_ms: 1000
  #   cache_size_mb: 1024
  env:
    LLMTRACE_UPSTREAM_URL: "${LLMTRACE_UPSTREAM_URL}"
    # Option A — external production backend. Set LLMTRACE_STORAGE_PROFILE to
    # `production` and supply reachable URLs (uncomment the three lines) to
    # store traces + tenants outside the pod (fully durable across recreate):
    #   LLMTRACE_POSTGRES_URL: "${LLMTRACE_POSTGRES_URL}"
    #   LLMTRACE_CLICKHOUSE_URL: "${LLMTRACE_CLICKHOUSE_URL}"
    #   LLMTRACE_REDIS_URL: "${LLMTRACE_REDIS_URL}"
    # Default `sqlite` writes to container-local disk (lost on recreate
    # unless Option B's persistent_volume is attached, or you only ever
    # update via --strategy restart per Option C).
    LLMTRACE_STORAGE_PROFILE: "${LLMTRACE_STORAGE_PROFILE:-sqlite}"
    LLMTRACE_ML_ENABLED: "1"
    LLMTRACE_ML_PRELOAD: "1"
    LLMTRACE_ML_CACHE_DIR: /home/llmtrace/.cache/llmtrace/models
    LLMTRACE_LOG_LEVEL: "${LLMTRACE_LOG_LEVEL:-info}"
    LLMTRACE_LOG_FORMAT: json
    LLMTRACE_DATAMARKING_ENABLED: "true"
    LLMTRACE_DATAMARKING_SHADOW_MODE: "false"
    LLMTRACE_ZONE_DETECTION_ENABLED: "true"
    # Catch-all tenant for header-less /v1 traffic (issue #292): the proxy
    # stamps this id instead of creating a phantom tenant per call. NOT a
    # fixed id — the lifecycle generates a fresh catch-all uuid4 at provision,
    # sets it on this env, and creates the matching `catch-all` tenant row
    # (returned as `catch_all_tenant_id`). If left unset, the proxy
    # self-provisions one at startup. Do NOT hardcode it here.
    # Master key (32 bytes; 64-char hex or base64) used to encrypt per-tenant
    # upstream API keys at rest. MUST be stable across recreates or stored
    # ciphertext becomes undecryptable. Unset => per-tenant key writes fail
    # closed (proxy still boots; the global upstream key is still used).
    LLMTRACE_SECRET_ENCRYPTION_KEY: "${LLMTRACE_SECRET_ENCRYPTION_KEY:-}"
    RUST_LOG: info
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

dashboard:
  image: "ghcr.io/techlab-innov/llmtrace-dashboard:${LLMTRACE_VERSION:-latest}"
  port: 3000
  cpu: "2"
  memory: 2Gi
  replicas: 1
  health_check_path: /health
  startup_timeout_seconds: 300
  env:
    HOSTNAME: 0.0.0.0
    NODE_ENV: production
    LLMTRACE_AUTH_ADMIN_KEY: "${LLMTRACE_AUTH_ADMIN_KEY:-}"

# Optional per-tenant rate limit. Uncomment to surface tenant-specific
# limits to the proxy at provision time as `LLMTRACE_RATE_LIMIT_RPS` /
# `LLMTRACE_RATE_LIMIT_BURST` env vars. Both must be strictly positive.
# Sized higher than starter to match the pro tier's expected load.
# rate_limit:
#   requests_per_second: 500
#   burst_size: 1000

# Rotate the admin key once the proxy is up. Adds ~30s and changes the
# proxy instance_id + url; recommended for production. Opt-in.
# rotate_admin_after_bootstrap: true

# Dashboard login: the operator signs in with admin_username + the admin
# key (pinned via `api_key:` above or auto-generated). `admin_username` is
# a free string — either an email or a username is accepted. The lifecycle
# library does not validate format; the dashboard accepts whatever was
# seeded. Default is "admin"; override per tenant for a custom identity.
# admin_username: "ops@acme.example"
