# LLMTrace tenant config — starter tier example.
#
# Every field below is required from the caller. The `lifecycle` library has
# no built-in defaults for runtime config — what you write here is exactly
# what gets deployed.
#
# `${VAR}` and `${VAR:-default}` placeholders in string values are resolved
# from the process environment at deploy time. Use this to keep secrets out
# of the config file.
#
# Auth: `enable_proxy_auth` defaults to true. The lifecycle library issues
# TWO keys at provision time (see README "Per-tenant API key auth"):
#
#   - admin_key  — bootstrap admin scope. Used by the lifecycle layer to
#                  mint per-tenant keys + retained by the caller for the
#                  self-service / admin portal. NEVER given to the tenant.
#                  Sourced from `api_key:` below (if set) or `LLMTRACE_AUTH_ADMIN_KEY`
#                  in proxy.env, or auto-generated `llmt_<64-hex>`.
#   - api_key    — operator scope. Minted on the live proxy via
#                  POST /api/v1/auth/keys after the proxy is ready. This is
#                  the key handed to the tenant for runtime traffic; it
#                  cannot manage tenants/keys/audit logs.
#
# Both plaintext keys are exposed once in the result JSON (`api_key` and
# `admin_key`). Persist them in your secret store immediately. Set
# `enable_proxy_auth: false` to deploy an open proxy with no auth at all.

proxy:
  image: ghcr.io/techlab-innov/llmtrace-proxy:latest
  port: 8080
  cpu: "2"
  memory: 4Gi
  # sqlite metadata is per-pod on Basilica — replicas DO NOT share state.
  # To run replicas > 1, switch LLMTRACE_STORAGE_PROFILE to postgres and
  # set LLMTRACE_POSTGRES_URL via tenant_secrets_json. Until then,
  # replicas: 1 is the only correct setting; replicas > 1 will round-robin
  # to different sqlite files and produce intermittent stale reads.
  replicas: 1
  health_check_path: /health
  # ML preload (LLMTRACE_ML_ENABLED=1 + LLMTRACE_ML_PRELOAD=1) loads the
  # prompt_injection / ner / injecguard / piguard weights before /health flips
  # to ready. On this cpu=2 shape that takes 600-1500s in practice. The
  # lifecycle library auto-bumps to 1500s when both flags are on and this
  # value is lower; we set 1500 explicitly to silence the WARN and document
  # the cost. Set LLMTRACE_ML_PRELOAD=0 below for lazy load (first request
  # pays the model-load latency, subsequent requests are fast).
  startup_timeout_seconds: 1500
  env:
    LLMTRACE_UPSTREAM_URL: "${LLMTRACE_UPSTREAM_URL}"
    LLMTRACE_STORAGE_PROFILE: memory
    LLMTRACE_ML_ENABLED: "1"
    LLMTRACE_ML_PRELOAD: "1"
    LLMTRACE_ML_CACHE_DIR: /home/llmtrace/.cache/llmtrace/models
    LLMTRACE_LOG_LEVEL: info
    LLMTRACE_LOG_FORMAT: json
    RUST_LOG: info
    # Per-tenant upstream API key, pulled from process env at deploy time.
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

dashboard:
  image: ghcr.io/techlab-innov/llmtrace-dashboard:latest
  port: 3000
  cpu: "1"
  memory: 1Gi
  replicas: 1
  health_check_path: /health
  startup_timeout_seconds: 300
  env:
    HOSTNAME: 0.0.0.0
    NODE_ENV: production
    # LLMTRACE_AUTH_ADMIN_KEY is set by the lifecycle library at provision
    # time to match the proxy's resolved admin key (used by dashboard
    # server-side handlers for admin endpoints). The operator key minted
    # for tenant runtime traffic is returned in TenantInstances.api_key
    # and is NOT injected into the dashboard env — no dashboard code
    # path consumes it today. If you set LLMTRACE_AUTH_ADMIN_KEY here
    # explicitly, that value wins for the dashboard env.

# Optional — override if your tenant naming scheme differs.
# proxy_name_template: "llmtrace-proxy-{tenant_id}"
# dashboard_name_template: "llmtrace-dashboard-{tenant_id}"
# inject_proxy_url_into_dashboard: true
# proxy_url_env_var: LLMTRACE_PROXY_URL

# Auth controls (defaults shown). `api_key` here pins the BOOTSTRAP ADMIN
# key (so the admin_key stays stable across recreates). The runtime
# operator key is always re-minted on recreate (the proxy's DB is fresh)
# and verified-or-re-minted on restart (same volume).
# enable_proxy_auth: true
# api_key: null

# Dashboard login: the operator signs in to the dashboard with the
# admin_username below + the admin key (api_key above, or auto-generated).
# `admin_username` is a free string — either an email or a username works.
# The lifecycle library does not validate the format; the dashboard accepts
# whatever was seeded. Default is "admin"; override for a custom identity:
# admin_username: "alice@acme.example"

# Optional per-tenant rate limit. When uncommented, the lifecycle library
# injects `LLMTRACE_RATE_LIMIT_RPS` and `LLMTRACE_RATE_LIMIT_BURST` into the
# proxy env at provision time. Both must be strictly positive. Omit the
# whole block to keep the proxy's built-in default (100 rps / 200 burst).
# rate_limit:
#   requests_per_second: 50
#   burst_size: 100

# rotate_admin_after_bootstrap: false
# ↑ Set to `true` for production tenants where the bootstrap admin key
#   must be invalidated immediately after provision. Adds ~30s to
#   provisioning (extra proxy re-roll) and changes the proxy
#   instance_id + url — caller must persist the post-rotation values.
#   See README.md → "Admin key rotation".
