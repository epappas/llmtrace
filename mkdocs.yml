site_name: LLMTrace
site_url: https://docs.llmtrace.setloop.io
site_description: Zero-code LLM observability and security for production. Transparent proxy that captures, analyses, and secures LLM interactions in real-time.
site_author: LLMTrace contributors
repo_url: https://github.com/epappas/llmtrace
repo_name: epappas/llmtrace
edit_uri: edit/main/docs/
copyright: Copyright &copy; LLMTrace contributors. Licensed under MIT.

theme:
  name: material
  custom_dir: _overrides
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/epappas/llmtrace
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/llmtrace
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/llmtracing/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - timetoread:
      wpm: 210
  - table-reader
  - tags
  - minify:
      minify_html: true
      minify_css: true

hooks:
  - hooks/llm_utils.py

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/tts.js
  - javascripts/copy-llm.js

extra_css:
  - css/custom.css

exclude_docs: |
  README.md
  prompts/
  TODO.md
  TODO_E2E.md

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: info
  anchors: info
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: info
    anchors: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - OpenAI SDK: guides/integration-openai.md
      - LangChain: guides/integration-langchain.md
      - curl / HTTP: guides/integration-curl.md
      - Custom Policies: guides/custom-policies.md
      - Proxy Configuration Catalogue: guides/proxy-config.md
      - Pre-Request Enforcement: guides/enforcement.md
      - LLM Judge Setup: guides/llm-judge.md
      - Auth & Multi-Tenancy: guides/auth-tenancy.md
      - Dashboard: guides/dashboard.md
      - Monitoring: guides/monitoring.md
      - Troubleshooting: guides/troubleshooting.md
      - REST API: guides/API.md
  - Deployment:
      - Docker Compose: deployment/docker-compose.md
      - Kubernetes: deployment/kubernetes.md
      - Secrets Management: deployment/secrets-management.md
  - Operations:
      - Feature Flags: runbooks/feature-flags.md
      - Judge Golden-Set Drift: runbooks/judge-golden-set-drift.md
      - Dashboard Features: dashboard-features.md
  - Reference:
      - Changelog: changelog.md
  - Community:
      - Contributing: contributing.md
      - Code of Conduct: code-of-conduct.md
      - Security Policy: security-policy.md
