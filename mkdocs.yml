site_name: LLMTrace
site_url: https://docs.llmtrace.io
site_description: Zero-code LLM observability and security for production. Transparent proxy that captures, analyzes, and secures LLM interactions in real-time.
site_author: LLMTrace contributors
repo_url: https://github.com/epappas/llmtrace
repo_name: epappas/llmtrace
edit_uri: edit/main/docs/
copyright: Copyright &copy; LLMTrace contributors. Licensed under MIT.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/epappas/llmtrace
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/llmtrace
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/llmtracing/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

exclude_docs: |
  README.md
  prompts/
  TODO.md

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: info
  anchors: info
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: info
    anchors: info
    unrecognized_links: info

